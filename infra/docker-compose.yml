# Infraestructura de canales/omnicanal para Fuerza Laboral Virtual.
#
# IMPORTANTE: este compose está listo para desplegar (basado en los
# docker-compose oficiales de cada proyecto), pero NO se puede levantar
# dentro de este sandbox de desarrollo porque no hay daemon de Docker
# disponible aquí. Pensado para correr en un VPS/servidor con Docker
# (ver infra/README.md).
#
# Trae dos stacks independientes, cada uno con su propio Postgres/Redis,
# conectados por una red compartida para que Chatwoot pueda recibir los
# webhooks de Evolution API:
#   - evolution-api: gateway de WhatsApp (Baileys + WhatsApp Cloud API)
#   - chatwoot: bandeja omnicanal (WhatsApp/Instagram/FB/X/web) + escalamiento humano

version: "3.8"

services:
  # ---------------------------------------------------------------------
  # Evolution API — gateway de WhatsApp
  # Referencia: https://github.com/evolution-foundation/evolution-api
  # ---------------------------------------------------------------------
  evolution-api:
    container_name: fv_evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      - evolution-redis
      - evolution-postgres
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - asistentes-net
    env_file:
      - .env.evolution

  evolution-redis:
    container_name: fv_evolution_redis
    image: redis:latest
    restart: always
    command: ["redis-server", "--port", "6379", "--appendonly", "yes"]
    volumes:
      - evolution_redis:/data
    networks:
      - asistentes-net

  evolution-postgres:
    container_name: fv_evolution_postgres
    image: postgres:15
    restart: always
    env_file:
      - .env.evolution
    environment:
      - POSTGRES_DB=${EVOLUTION_POSTGRES_DB:-evolution_db}
      - POSTGRES_USER=${EVOLUTION_POSTGRES_USER:-evolution}
      - POSTGRES_PASSWORD=${EVOLUTION_POSTGRES_PASSWORD}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - asistentes-net

  # ---------------------------------------------------------------------
  # Chatwoot — bandeja omnicanal + escalamiento humano
  # Referencia: https://github.com/chatwoot/chatwoot (docker-compose.production.yaml)
  # ---------------------------------------------------------------------
  chatwoot-rails:
    container_name: fv_chatwoot_rails
    image: chatwoot/chatwoot:latest
    restart: always
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - chatwoot_storage:/app/storage
    env_file:
      - .env.chatwoot
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    networks:
      - asistentes-net

  chatwoot-sidekiq:
    container_name: fv_chatwoot_sidekiq
    image: chatwoot/chatwoot:latest
    restart: always
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    volumes:
      - chatwoot_storage:/app/storage
    env_file:
      - .env.chatwoot
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    networks:
      - asistentes-net

  chatwoot-postgres:
    container_name: fv_chatwoot_postgres
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${CHATWOOT_POSTGRES_PASSWORD}
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    networks:
      - asistentes-net

  chatwoot-redis:
    container_name: fv_chatwoot_redis
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    env_file:
      - .env.chatwoot
    volumes:
      - chatwoot_redis_data:/data
    networks:
      - asistentes-net

volumes:
  evolution_instances:
  evolution_redis:
  evolution_postgres_data:
  chatwoot_storage:
  chatwoot_postgres_data:
  chatwoot_redis_data:

networks:
  asistentes-net:
    name: asistentes-net
    driver: bridge
